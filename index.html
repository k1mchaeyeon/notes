<!doctype html>
<html lang="ko">
<head>

<title>김채연 노트</title>
<style>
:root{--bg:#fafafa;--fg:#18181b;--muted:#71717a;--line:#e4e4e7;--card:#fff;--accent:#2563eb}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:1.4rem;margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card strong{display:block;font-size:1.05rem}
a.card span{color:var(--muted);font-size:.93rem}
footer{margin-top:28px;font-size:.88rem;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
