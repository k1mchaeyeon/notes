<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최종 프로젝트 샘플 대시보드</title>
<style>
:root { --bg:#f7f6f2; --fg:#1d1c1a; --muted:#6b6862; --line:#d9d6ce; --card:#fff; --accent:#c2410c; }
@media (prefers-color-scheme: dark) { :root { --bg:#181715; --fg:#eeece6; --muted:#a29f97; --line:#34322e; --card:#22211e; --accent:#fb923c; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height:1.5; }
main { max-width:720px; margin:0 auto; padding:48px 16px; }
h1 { font-size:1.6rem; margin:0 0 6px; }
p.lead { color:var(--muted); margin:0 0 28px; }
a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:14px; color:inherit; text-decoration:none; }
a.card:hover { border-color:var(--accent); }
a.card strong { display:block; font-size:1.1rem; margin-bottom:4px; }
a.card span { color:var(--muted); font-size:.95rem; }
.note { margin-top:28px; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>최종 프로젝트 샘플 대시보드</h1>
  <p class="lead">주제 논의용 시안입니다. 모든 수치는 더미 데이터예요.</p>
  <a class='card' href='highway'><strong>고속도로 사고·정체 모니터</strong><span>사고 후 정체가 어디까지, 얼마나 오래 번지는지 보는 교통 상황실용 화면</span></a>
  <a class='card' href='airport'><strong>공항 지연 연쇄 보드</strong><span>한 편의 지연이 같은 기체의 다음 편들로 번지는 걸 추적하는 항공사 운항통제용 화면</span></a>
  <p class="note">SeSAC 최종 프로젝트 3팀 · 2026-11-13</p>
</main>
</body>
</html>
